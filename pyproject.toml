[project]
name = "marvin-ai-anthropic"
version = "0.2.0"
description = "Anthropic for Marvin: Claude through the Messages API, as an AI provider plugin."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 0.8: the AI provider contract (AIProvider, AIProviderPlugin, Credential, ModelPrice) and its conformance kit.
    "marvin-integration-sdk>=0.10,<1",
    # 0.40: the Messages API with tool use, `base_url` / `http_client` / `max_retries` on the client and `models.list`.
    "anthropic>=0.40,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.urls]
Repository = "https://github.com/InnerOpen/marvin-ai-anthropic"

# The seam that makes the plugin discoverable: Marvin scans this group at startup. The slug replaces
# core's built-in provider of the same name.
[project.entry-points."marvin.ai_providers"]
anthropic = "marvin_ai_anthropic:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marvin_ai_anthropic"]

# Dev only: the SDK commit Marvin core pins (pyproject.toml there), so tests run against the contract the
# image ships. Released installs take the SDK from plugins.packages / the index.
[tool.uv.sources]
marvin-integration-sdk = { git = "https://github.com/InnerOpen/marvin-integration-sdk", rev = "42b67323ba0070f19260e637c2ef9d198b02d94f" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Anthropic API (ANTHROPIC_API_KEY); skipped when unset"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
