name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # No API key here: the conformance kit and the unit tests talk to a fake Anthropic server.
      - name: Test
        run: uv run --extra dev pytest -q -rs
      - name: Lint
        run: |
          uv run --extra dev ruff check .
          uv run --extra dev ruff format --check .
